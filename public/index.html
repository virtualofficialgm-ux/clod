<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2f2f7">
  <title>Parri Pay</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="ambient" aria-hidden="true"><span></span><span></span><span></span></div>

  <div class="app" id="app">
    <header class="topbar">
      <button class="avatar" id="who" aria-label="Сменить пользователя"></button>
      <div class="topbar-title" id="topbar-title">Parri Pay</div>
      <button class="icon-btn" id="bell" aria-label="Уведомления"></button>
    </header>

    <main class="screen" id="screen" tabindex="-1"></main>

    <nav class="tabbar" id="tabbar" aria-label="Разделы">
      <button data-tab="home" class="active"><i data-icon="home"></i><span>Главная</span></button>
      <button data-tab="pay"><i data-icon="send"></i><span>Оплата</span></button>
      <button data-tab="history"><i data-icon="clock"></i><span>История</span></button>
      <button data-tab="more"><i data-icon="grid"></i><span>Ещё</span></button>
    </nav>
  </div>

  <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" hidden>
    <div class="grabber" aria-hidden="true"></div>
    <div class="sheet-body" id="sheet-body"></div>
  </section>
  <div class="toast" id="toast" role="status" hidden></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
