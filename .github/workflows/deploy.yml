# Выкладка сайта на хостинг (Джино) при каждом изменении в main,
# в том числе после сохранения в админке. Подключение защищённое: FTP с шифрованием TLS (FTPS).
# Доступы хранятся в секретах репозитория: Settings → Secrets and variables → Actions.
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD, FTP_DIR
#   необязательно: FTP_PROTOCOL (ftp — FTPS с TLS, или sftp; по умолчанию ftp), FTP_PORT (по умолчанию 21)
name: Выкладка на хостинг

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Проверка доступов
        id: check
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          if [ -z "$FTP_SERVER" ]; then
            echo "::notice::Секреты FTP ещё не добавлены — выкладка пропущена."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.check.outputs.skip != 'true'

      - name: Загрузка файлов на хостинг
        if: steps.check.outputs.skip != 'true'
        env:
          SERVER: ${{ secrets.FTP_SERVER }}
          USER: ${{ secrets.FTP_USERNAME }}
          PASS: ${{ secrets.FTP_PASSWORD }}
          DIR: ${{ secrets.FTP_DIR }}
          PROTOCOL: ${{ secrets.FTP_PROTOCOL || 'ftp' }}
          PORT: ${{ secrets.FTP_PORT || '21' }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp sshpass > /dev/null
          if [ "$PROTOCOL" = "sftp" ]; then
            # проверка входа: в логе видно, пускает ли сервер и почему нет (пароль не печатается)
            SSHPASS="$PASS" sshpass -e ssh -v -p "$PORT" -o StrictHostKeyChecking=no -o ConnectTimeout=20 \
              -o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no \
              "$USER@$SERVER" true 2>&1 | grep -E "Connecting to|Connection established|Authentications that can continue|Authenticated|Permission denied|refused|timed out|closed" || true
          fi
          # пароль передаётся через переменную окружения, чтобы спецсимволы в нём ничего не ломали
          export LFTP_PASSWORD="$PASS"
          lftp --env-password -u "$USER" -p "$PORT" "$PROTOCOL://$SERVER" -e "
            set net:max-retries 2; set net:timeout 30;
            set sftp:auto-confirm yes; set ftp:ssl-force true; set ssl:verify-certificate no;
            mirror -R --verbose --parallel=4 \
              -X .git/ -X .github/ -X dist/ -X README.md -X .gitignore \
              ./ ${DIR:-./};
            bye"
