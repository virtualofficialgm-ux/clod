<style>
:root {
  color-scheme: light;
  --bg: #ffffff;
  --fg: #1c1c1c;
  --logo: #363636;
  --muted: #8a8a8a;
  --line: #e4e4e4;
  --display: "Fira Sans Extra Condensed", "Arial Narrow", sans-serif;
  --text: "Manrope", system-ui, sans-serif;
  --pad: clamp(20px, 6vw, 120px);
  --ease: cubic-bezier(.77, 0, .175, 1);
  --ease-out: cubic-bezier(.16, 1, .3, 1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--text);
  font-weight: 300;
  font-size: 17px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
body.is-loading { overflow: hidden; }

a { color: inherit; text-decoration: none; }
::selection { background: var(--fg); color: var(--bg); }

/* ——— Логотип ——— */
.logo { color: var(--logo); }
.logo__row { display: block; width: 100%; height: auto; overflow: visible; }
.logo__row path { fill: currentColor; }

/* ——— Прелоадер ——— */
.preloader {
  position: fixed; inset: 0; z-index: 100;
  display: grid; place-items: center;
  background: var(--bg);
  transition: transform 1s var(--ease) .1s;
}
.preloader__tri { width: 48px; height: 82px; overflow: visible; }
.preloader__shape { fill: var(--logo); }
/* треугольник «рисуется»: маска-линия открывает настоящую закруглённую форму логотипа */
.tri-mask, .logo__row path.tri-mask {
  fill: none; stroke: #fff; stroke-width: 14;
  stroke-linecap: butt; stroke-linejoin: round;
  stroke-dasharray: 1 1.2; stroke-dashoffset: 1.1;
}
.preloader__tri .tri-mask { animation: draw 1.2s var(--ease) forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
body.is-loaded .preloader { transform: translateY(-100%); }

/* ——— Курсор ——— */
.cursor {
  position: fixed; top: 0; left: 0; z-index: 90;
  width: 10px; height: 10px; margin: -5px 0 0 -5px;
  border-radius: 50%;
  background: #fff;
  mix-blend-mode: difference;
  pointer-events: none;
  transition: width .35s var(--ease-out), height .35s var(--ease-out), margin .35s var(--ease-out), opacity .3s;
  opacity: 0;
}
.cursor.is-active { opacity: 1; }
.cursor.is-hover { width: 56px; height: 56px; margin: -28px 0 0 -28px; }
@media (hover: none) { .cursor { display: none; } }

/* ——— Шапка ——— */
.header {
  position: fixed; left: 0; right: 0; z-index: 50;
  display: flex; align-items: center; justify-content: space-between;
  padding: 24px max(var(--pad), env(safe-area-inset-right, 0px)) 24px max(var(--pad), env(safe-area-inset-left, 0px));
  top: env(safe-area-inset-top, 0px);
  transition: background .4s, padding .4s, transform .5s var(--ease);
}
.header.is-scrolled {
  background: rgba(255,255,255,.88);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  padding-top: 14px; padding-bottom: 14px;
}
.header.is-hidden { transform: translateY(-100%); }

.header__logo { display: block; color: var(--logo); line-height: 0; }
.header__mark { display: block; height: 22px; width: auto; }
.header__mark path { fill: currentColor; }
.nav { display: flex; gap: 40px; }
.nav a, .footer a {
  position: relative;
  font-size: 13px; letter-spacing: .12em; text-transform: uppercase; font-weight: 400;
}
.nav a::after, .footer a::after, .contacts a::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: -4px; height: 1px;
  background: currentColor;
  transform: scaleX(0); transform-origin: right;
  transition: transform .5s var(--ease);
}
.nav a:hover::after, .footer a:hover::after, .contacts a:hover::after { transform: scaleX(1); transform-origin: left; }

.burger { display: none; background: none; border: 0; width: 32px; height: 20px; position: relative; cursor: pointer; }
.burger span { position: absolute; left: 0; right: 0; height: 1px; background: var(--fg); transition: transform .4s var(--ease), top .4s var(--ease); }
.burger span:first-child { top: 5px; }
.burger span:last-child { top: 14px; }
.burger[aria-expanded="true"] span:first-child { top: 10px; transform: rotate(45deg); }
.burger[aria-expanded="true"] span:last-child { top: 10px; transform: rotate(-45deg); }

/* ——— Hero ——— */
.hero {
  min-height: 100vh; min-height: 100svh;
  display: flex; flex-direction: column; justify-content: center;
  padding: 140px var(--pad) 48px;
  position: relative;
}
.hero__title {
  /* ширина логотипа: по ширине экрана, но так, чтобы он помещался по высоте */
  width: min(100%, 1180px, 128vh);
}
.hero__title .line { display: block; overflow: hidden; }
.hero__title .line--2 { margin-top: 3.95%; }
.hero__title .line--3 { margin-top: 2.8%; }
.hero__title .logo__row {
  transform: translateY(105%);
  transition: transform 1.3s var(--ease);
}
.hero__title .line--2 .logo__row { transition-delay: .12s; }
.hero__title .line--3 .logo__row { transition-delay: .24s; }
body.is-loaded .hero__title .logo__row { transform: none; }

/* треугольник рисуется после появления слова — сразу своей закруглённой формой */
.hero__title .tri-mask { transition: stroke-dashoffset 1.6s var(--ease) .9s; }
body.is-loaded .hero__title .tri-mask { stroke-dashoffset: 0; }

.hero__bottom {
  display: flex; justify-content: space-between; align-items: flex-end; gap: 32px;
  margin-top: clamp(40px, 8vh, 96px);
}
.hero__lead { max-width: 380px; color: var(--muted); }
.hero__scroll {
  display: flex; flex-direction: column; align-items: center; gap: 12px;
  font-size: 12px; letter-spacing: .2em; text-transform: uppercase;
}
.hero__scroll i { display: block; width: 1px; height: 64px; background: var(--line); position: relative; overflow: hidden; }
.hero__scroll i::after {
  content: ""; position: absolute; left: 0; top: -100%; width: 100%; height: 100%;
  background: var(--fg);
  animation: scrollLine 2.2s var(--ease) infinite;
}
@keyframes scrollLine { 0% { top: -100%; } 60%, 100% { top: 100%; } }

/* ——— Бегущая строка ——— */
.marquee {
  border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
  overflow: hidden; white-space: nowrap;
  padding: 22px 0;
}
.marquee__track {
  display: inline-flex; align-items: center; gap: 48px;
  font-family: var(--display); font-weight: 200; text-transform: uppercase;
  font-size: clamp(28px, 4vw, 56px); letter-spacing: .1em;
  animation: marquee 32s linear infinite;
}
.marquee__track b { font-weight: 200; font-size: .55em; }
@keyframes marquee { to { transform: translateX(-50%); } }

/* ——— Секции ——— */
.section { padding: clamp(96px, 16vh, 180px) var(--pad); }
.section__label {
  font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted);
  margin-bottom: 48px;
}
.section__title, .about__title {
  font-family: var(--display); font-weight: 200; text-transform: uppercase;
  font-size: clamp(40px, 6vw, 96px); line-height: 1.05; letter-spacing: .09em;
  margin-bottom: clamp(48px, 8vh, 96px);
}

.about__grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 64px; align-items: end; }
.about__title { margin-bottom: 0; }
.about__text p + p { margin-top: 20px; }

.stats {
  display: grid; grid-template-columns: repeat(3, 1fr);
  margin-top: clamp(72px, 12vh, 140px);
  border-top: 1px solid var(--fg);
}
.stat { padding: 32px 24px 0 0; display: flex; align-items: flex-start; gap: 20px; }
.stat__num { font-family: var(--display); font-weight: 200; font-size: clamp(64px, 8vw, 128px); line-height: .9; }
.stat__label { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding-top: 8px; line-height: 1.5; }

/* ——— Афиша ——— */
.events { list-style: none; border-top: 1px solid var(--line); }
.event {
  position: relative;
  display: grid; grid-template-columns: 180px 1fr auto; align-items: center; gap: 32px;
  padding: 36px 0;
  border-bottom: 1px solid var(--line);
  isolation: isolate;
}
.event::before {
  content: ""; position: absolute; inset: 0 calc(var(--pad) * -1); z-index: -1;
  background: var(--fg);
  transform: scaleY(0); transform-origin: bottom;
  transition: transform .6s var(--ease);
}
.event, .event * { transition: color .45s var(--ease), border-color .45s var(--ease), background .45s var(--ease); }
.event:hover { color: var(--bg); }
.event:hover::before { transform: scaleY(1); transform-origin: top; }
.event:hover .event__meta { color: #aaa; }

.event__date { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; display: flex; align-items: baseline; gap: 12px; }
.event__date span { font-family: var(--display); font-weight: 200; font-size: 56px; line-height: 1; letter-spacing: 0; }
.event__title {
  font-family: var(--display); font-weight: 300; text-transform: uppercase;
  font-size: clamp(28px, 3.2vw, 48px); letter-spacing: .08em; line-height: 1.1;
  transition: transform .6s var(--ease-out) !important;
}
.event:hover .event__title { transform: translateX(16px); }
.event__meta { color: var(--muted); font-size: 14px; margin-top: 6px; }
.event__btn {
  font-size: 12px; letter-spacing: .18em; text-transform: uppercase; font-weight: 400;
  border: 1px solid currentColor; border-radius: 999px;
  padding: 14px 28px;
}
.event:hover .event__btn { background: var(--bg); color: var(--fg); border-color: var(--bg); }
.event__btn { white-space: nowrap; }
.event__btn.is-soon { opacity: .45; cursor: default; }
.event:hover .event__btn.is-soon { background: transparent; color: inherit; border-color: currentColor; }

.event__desc { font-size: 14px; margin-top: 10px; max-width: 560px; }
.events__empty { padding: 36px 0; color: var(--muted); list-style: none; }

/* ——— Новости ——— */
.news__list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 48px 40px; }
.news-item { display: flex; flex-direction: column; gap: 12px; border-top: 1px solid var(--fg); padding-top: 24px; min-width: 0; }
.news-item__img { aspect-ratio: 4 / 3; overflow: hidden; background: var(--line); margin-bottom: 8px; }
.news-item__img img { width: 100%; height: 100%; object-fit: cover; transition: transform 1.2s var(--ease-out); }
.news-item:hover .news-item__img img { transform: scale(1.04); }
.news-item__date { font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
.news-item__title {
  font-family: var(--display); font-weight: 300; text-transform: uppercase;
  font-size: clamp(24px, 2.2vw, 32px); letter-spacing: .08em; line-height: 1.15;
}
.news-item__text { color: var(--muted); }
.news-item__links { list-style: none; display: flex; flex-direction: column; gap: 8px; margin-top: 4px; padding-top: 12px; border-top: 1px solid var(--line); }
.news-item__links a {
  position: relative; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; font-weight: 400;
}
.news-item__links a::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: -3px; height: 1px; background: currentColor;
  transform: scaleX(0); transform-origin: right; transition: transform .5s var(--ease);
}
.news-item__links a:hover::after { transform: scaleX(1); transform-origin: left; }

/* ——— Проекты ——— */
.cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0; border-left: 1px solid var(--line); }
.card {
  position: relative;
  padding: 40px 32px 56px;
  border-right: 1px solid var(--line); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
  min-height: 360px;
  display: flex; flex-direction: column;
  overflow: hidden;
}
.card::after {
  content: ""; position: absolute; right: 32px; bottom: 40px;
  width: 28px; height: 28px;
  border-left: 14px solid transparent; border-right: 14px solid transparent;
  border-bottom: 24px solid var(--fg);
  width: 0; height: 0;
  opacity: 0; transform: translateY(20px);
  transition: opacity .5s var(--ease), transform .6s var(--ease-out);
}
.card:hover::after { opacity: 1; transform: none; }
.card__num { font-size: 12px; letter-spacing: .2em; color: var(--muted); }
.card h3 {
  font-family: var(--display); font-weight: 300; text-transform: uppercase;
  font-size: clamp(28px, 2.6vw, 40px); letter-spacing: .08em;
  margin: auto 0 16px; padding-top: 96px;
}
.card p { color: var(--muted); max-width: 300px; }

/* ——— Цитата ——— */
.quote { padding: clamp(80px, 14vh, 160px) var(--pad); background: var(--fg); color: var(--bg); }
.quote__text {
  font-family: var(--display); font-weight: 200;
  font-size: clamp(32px, 5vw, 80px); line-height: 1.12; letter-spacing: .02em;
  max-width: 1200px;
}

/* ——— Контакты ——— */
.contacts__big {
  font-family: var(--display); font-weight: 200;
  font-size: clamp(56px, 12vw, 220px); line-height: .95; letter-spacing: .08em;
  margin-bottom: clamp(56px, 10vh, 120px);
}
.contacts__big a { display: inline-block; transition: letter-spacing .8s var(--ease-out); }
.contacts__big a::after { display: none; }
.contacts__big a:hover { letter-spacing: .12em; }
.contacts__grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 32px; border-top: 1px solid var(--fg); padding-top: 32px; }
.contacts__cap { display: block; font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }
.contacts a { position: relative; }

/* ——— Подвал ——— */
.footer {
  display: flex; justify-content: space-between; gap: 16px;
  padding: 32px var(--pad);
  border-top: 1px solid var(--line);
  font-size: 13px; color: var(--muted);
}

/* ——— Появление при скролле ——— */
.js .reveal.pending {
  opacity: 0; transform: translateY(40px);
  transition: opacity 1.1s var(--ease-out), transform 1.1s var(--ease-out);
  transition-delay: var(--d, 0s);
}
.reveal { transition: opacity 1.1s var(--ease-out), transform 1.1s var(--ease-out); transition-delay: var(--d, 0s); }
.event.reveal { transition-property: opacity, transform, color; }

/* ——— Адаптив ——— */
@media (max-width: 900px) {
  .nav {
    position: fixed; inset: 0; z-index: -1;
    flex-direction: column; justify-content: center; align-items: flex-start; gap: 24px;
    padding: 0 var(--pad);
    background: var(--bg);
    clip-path: inset(0 0 100% 0);
    transition: clip-path .8s var(--ease);
  }
  .nav a { font-family: var(--display); font-weight: 200; font-size: 44px; letter-spacing: .04em; }
  .nav.is-open { clip-path: inset(0 0 0 0); }
  .burger { display: block; }
  .about__grid { grid-template-columns: 1fr; gap: 40px; }
  .stats { grid-template-columns: 1fr; }
  .stat { padding-bottom: 24px; border-bottom: 1px solid var(--line); }
  .event { grid-template-columns: 1fr; gap: 12px; }
  .event__btn { justify-self: start; }
  .cards { grid-template-columns: 1fr; }
  .news__list { grid-template-columns: 1fr; }
  .card { min-height: 280px; }
  .contacts__grid { grid-template-columns: 1fr 1fr; }
  .hero__lead { font-size: 15px; }
}
@media (max-width: 520px) {
  .contacts__grid { grid-template-columns: 1fr; }
  .hero__scroll { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .reveal, .hero__title .logo__row { opacity: 1; transform: none; }
  .tri-mask { stroke-dashoffset: 0 !important; }
}

/* боковые отступы с учётом системных панелей */
.hero, .section, .quote, .footer { padding-left: max(var(--pad), env(safe-area-inset-left, 0px)); padding-right: max(var(--pad), env(safe-area-inset-right, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--bg); }

[hidden] { display: none !important; }
</style>
</head>

<script>
(() => {
  const body = document.body;
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Прелоадер
  const finishLoading = () => {
    body.classList.add('is-loaded');
    setTimeout(() => body.classList.remove('is-loading'), 900);
  };
  window.addEventListener('load', () => setTimeout(finishLoading, reduced ? 0 : 900));
  setTimeout(finishLoading, 2500); // запасной вариант, если шрифты грузятся долго

  document.getElementById('year').textContent = new Date().getFullYear();

  // Шапка: фон при скролле и скрытие при прокрутке вниз
  const header = document.querySelector('.header');
  let lastY = 0;
  window.addEventListener('scroll', () => {
    const y = window.scrollY;
    header.classList.toggle('is-scrolled', y > 40);
    header.classList.toggle('is-hidden', y > lastY && y > 400 && !nav.classList.contains('is-open'));
    lastY = y;
  }, { passive: true });

  // Мобильное меню
  const burger = document.querySelector('.burger');
  const nav = document.querySelector('.nav');
  burger.addEventListener('click', () => {
    const open = nav.classList.toggle('is-open');
    burger.setAttribute('aria-expanded', open);
    body.style.overflow = open ? 'hidden' : '';
  });
  nav.querySelectorAll('a').forEach(a => a.addEventListener('click', () => {
    nav.classList.remove('is-open');
    burger.setAttribute('aria-expanded', 'false');
    body.style.overflow = '';

  // ——— Контент сайта: берётся из content/*.json (редактируется в /admin) ———
  const esc = str => String(str ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const MONTHS = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
  const parseDate = s => { const [d, t = '00:00'] = String(s).split('T'); const [y, m, day] = d.split('-').map(Number); const [hh, mm] = t.split(':').map(Number); return new Date(y, m - 1, day, hh || 0, mm || 0); };
  const pad = n => String(n).padStart(2, '0');
  const textOnly = !!window.__TEXT_CONTACTS__; // в превью ссылки mailto/tel не работают

  const loadContent = async () => {
    if (window.__CONTENT__) return window.__CONTENT__;
    const get = name => fetch(`content/${name}.json`, { cache: 'no-cache' }).then(r => r.json());
    const [settings, afisha, news] = await Promise.all([get('settings'), get('afisha'), get('news')]);
    return { settings, afisha, news };

  const render = ({ settings: s, afisha, news }) => {

    // спектакли без даты («дата скоро») показываются в конце списка
    const when = e => (e.date ? parseDate(e.date).getTime() : Infinity);
    const events = (afisha.events || []).filter(e => when(e) >= startOfToday).sort((a, b) => when(a) - when(b));
    document.getElementById('events').innerHTML = events.length ? events.map(e => {
      const d = e.date ? parseDate(e.date) : null;

      const btn = e.ticket_url

      return `<li class="event reveal">
          <div class="event__date">${d ? `<span>${pad(d.getDate())}</span>${MONTHS[d.getMonth()]}` : '<span>Скоро</span>'}</div>

          <time class="news-item__date">${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}</time>
          <h3 class="news-item__title">${esc(n.title)}</h3>
          ${String(n.text || '').split(/\n\s*\n/).filter(Boolean).map(p => `<p class="news-item__text">${esc(p)}</p>`).join('')}
          ${(n.links || []).filter(l => l && l.url).length ? `<ul class="news-item__links">${n.links.filter(l => l && l.url).map(l =>
            `<li><a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.title || l.url)} <span aria-hidden="true">↗</span></a></li>`).join('')}</ul>` : ''}
        </article>`;
    }).join('') : '<p class="events__empty reveal">Новостей пока нет</p>';

    document.getElementById('cards').innerHTML = (s.projects || []).map((p, i) => `<article class="card reveal">
          <span class="card__num">${pad(i + 1)}</span>
          <h3>${esc(p.title)}</h3>
          <p>${esc(p.text)}</p>
        </article>`).join('');

    const c = s.contacts || {};
    const tel = String(c.phone || '').replace(/[^\d+]/g, '');
    const link = (href, text) => textOnly || !href ? esc(text) : `<a href="${esc(href)}"${href.startsWith('http') ? ' target="_blank" rel="noopener"' : ''}>${esc(text)}</a>`;
    const socials = [c.vk && link(c.vk, 'ВКонтакте'), c.telegram && link(c.telegram, 'Telegram')].filter(Boolean).join(' · ');
    document.getElementById('contacts-info').innerHTML = [
      ['Адрес', esc(c.address)],
      ['Телефон', link(tel && `tel:${tel}`, c.phone)],
      ['Почта', link(c.email && `mailto:${c.email}`, c.email)],
      socials && ['Соцсети', socials],
    ].filter(row => row && row[1]).map(([cap, val]) => `<div class="reveal"><span class="contacts__cap">${cap}</span><p>${val}</p></div>`).join('');
    if (c.email && !textOnly) document.getElementById('write-us').href = `mailto:${c.email}`;
  };

  const initAnimations = () => {
    // Появление элементов при скролле (с каскадной задержкой внутри группы)
    document.querySelectorAll('.events, .cards, .stats, .contacts__grid, .about__text, .news__list').forEach(group => {
      [...group.querySelectorAll('.reveal')].forEach((el, i) => el.style.setProperty('--d', `${i * 0.1}s`));
    });

    const counters = document.querySelectorAll('[data-count]');
    const countUp = el => {
      const target = +el.dataset.count;
      const start = performance.now();
      const dur = 1600;
      const tick = now => {
        const p = Math.min((now - start) / dur, 1);
        el.textContent = Math.round(target * (1 - Math.pow(1 - p, 4)));
        if (p < 1) requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    };

    // скрываем до появления только то, что ниже первого экрана
    document.documentElement.classList.add('js');
    document.querySelectorAll('.reveal').forEach(el => {
      if (el.getBoundingClientRect().top > window.innerHeight) el.classList.add('pending');
      else el.querySelectorAll('[data-count]').forEach(c => (c.textContent = c.dataset.count));
    });
    const io = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (!entry.isIntersecting) return;
        entry.target.classList.remove('pending');
        const counter = entry.target.querySelector('[data-count]');
        if (counter) countUp(counter);
        io.unobserve(entry.target);
      });
    }, { threshold: 0.15, rootMargin: '0px 0px -40px 0px' });
    document.querySelectorAll('.reveal.pending').forEach(el => io.observe(el));
    if (reduced) counters.forEach(c => (c.textContent = c.dataset.count));

    // Кастомный курсор
    const cursor = document.querySelector('.cursor');
    if (window.matchMedia('(hover: hover)').matches && !reduced) {
      let x = 0, y = 0, cx = 0, cy = 0;
      window.addEventListener('mousemove', e => {
        x = e.clientX; y = e.clientY;
        cursor.classList.add('is-active');
      });
      document.addEventListener('mouseleave', () => cursor.classList.remove('is-active'));
      const loop = () => {
        cx += (x - cx) * 0.18;
        cy += (y - cy) * 0.18;
        cursor.style.transform = `translate(${cx}px, ${cy}px)`;
        requestAnimationFrame(loop);
      };
      loop();
      document.querySelectorAll('a, button, .card').forEach(el => {
        el.addEventListener('mouseenter', () => cursor.classList.add('is-hover'));
        el.addEventListener('mouseleave', () => cursor.classList.remove('is-hover'));
      });
    }
  };

  loadContent()
    .then(render)
    .catch(err => console.error('Не удалось загрузить контент', err))
    .finally(initAnimations);
})();
</script>
</body>
</html>
