# Панель управления сайтом: https://<адрес-сайта>/admin
# Войти могут только пользователи GitHub с правом записи в репозиторий.
backend:
  name: github
  repo: virtualofficialgm-ux/clod
  branch: main
  # Вход через GitHub идёт через Netlify (сайт при этом живёт на Джино).
  # site_domain — адрес проекта на Netlify, где подключён OAuth-провайдер GitHub.
  base_url: https://api.netlify.com
  site_domain: teatrnv.netlify.app
  commit_messages:
    update: "Обновление: {{slug}}"

locale: ru
site_url: https://teatrnv.ru
display_url: https://teatrnv.ru
logo_url: /assets/favicon.svg

media_folder: assets/uploads
public_folder: /assets/uploads

collections:
  - name: afisha
    label: Афиша
    files:
      - name: afisha
        label: Спектакли в афише
        file: content/afisha.json
        fields:
          - name: events
            label: Спектакли
            label_singular: спектакль
            widget: list
            summary: "{{fields.title}}"
            hint: Прошедшие спектакли скрываются с сайта автоматически. Спектакль без даты показывается как «Скоро».
            fields:
              - { name: date, label: Дата и время, widget: datetime, format: "YYYY-MM-DDTHH:mm", date_format: "DD.MM.YYYY", time_format: "HH:mm", required: false, hint: "Оставьте пустым, если дата ещё неизвестна" }
              - { name: title, label: Название спектакля, widget: relation, collection: shows, file: shows, search_fields: ["shows.*.title"], value_field: "shows.*.title", display_fields: ["shows.*.title"], hint: "Сначала добавьте спектакль в разделе «Спектакли»" }
              - { name: category, label: "Тип (например: Молодая сцена, Эксклюзивный проект)", widget: string, required: false }
              - { name: venue, label: Площадка, widget: string, required: false, hint: "Например: Театр в Хамовниках" }
              - { name: age, label: Возраст, widget: string, required: false, hint: "Например: 12+" }
              - { name: duration, label: Длительность, widget: string, required: false, hint: "Например: 90 мин" }
              - { name: ticket_url, label: Ссылка на покупку билетов, widget: string, required: false, hint: "Вставьте ссылку из билетного агрегатора. Пока поле пустое, на сайте неактивная кнопка «Билеты скоро»; со ссылкой — кнопка «Купить билеты»." }
              - { name: description, label: Короткое описание, widget: text, required: false }

  - name: shows
    label: Спектакли
    files:
      - name: shows
        label: Спектакли (подробные страницы)
        file: content/shows.json
        fields:
          - name: shows
            label: Спектакли
            label_singular: спектакль
            widget: list
            summary: "{{fields.title}}"
            hint: Здесь описание, фото и состав. Даты показов и билеты — в разделе «Афиша».
            fields:
              - { name: title, label: Название, widget: string, hint: "Должно совпадать с названием в «Афише»" }
              - { name: author, label: "Автор пьесы", widget: string, required: false, hint: "Например: Мольер" }
              - { name: genre, label: Жанр, widget: string, required: false, hint: "Например: Комедия" }
              - { name: age, label: Возраст, widget: string, required: false, hint: "Например: 16+" }
              - { name: duration, label: Длительность, widget: string, required: false, hint: "Например: 90 мин" }
              - { name: poster, label: Постер, widget: image, required: false }
              - { name: description, label: Описание спектакля, widget: text, required: false, hint: "Пустая строка между абзацами делит текст на абзацы" }
              - name: creators
                label: Создатели
                label_singular: создателя
                widget: list
                required: false
                summary: "{{fields.role}}: {{fields.name}}"
                fields:
                  - { name: role, label: "Кто (режиссёр, художник…)", widget: string }
                  - { name: name, label: Имя, widget: string }
              - name: cast
                label: Актёры
                label_singular: актёра
                widget: list
                required: false
                summary: "{{fields.name}} — {{fields.role}}"
                fields:
                  - { name: name, label: Имя актёра, widget: string }
                  - { name: role, label: Роль, widget: string, required: false }
                  - { name: photo, label: Фото, widget: image, required: false }
              - name: gallery
                label: Фотографии со спектакля
                label_singular: фото
                widget: list
                required: false
                field: { name: photo, label: Фото, widget: image }

  - name: news
    label: Новости
    files:
      - name: news
        label: Новости
        file: content/news.json
        fields:
          - name: items
            label: Новости
            label_singular: новость
            widget: list
            summary: "{{fields.date}} — {{fields.title}}"
            hint: На главной видно начало текста, полностью новость открывается на отдельной странице.
            fields:
              - { name: date, label: Дата, widget: datetime, format: "YYYY-MM-DD", date_format: "DD.MM.YYYY", time_format: false }
              - { name: title, label: Заголовок, widget: string }
              - { name: text, label: Текст, widget: text, hint: "Пустая строка между абзацами делит текст на абзацы" }
              - { name: image, label: Главное фото, widget: image, required: false }
              - name: gallery
                label: Фотографии
                label_singular: фото
                widget: list
                required: false
                field: { name: photo, label: Фото, widget: image }
              - name: links
                label: Ссылки на публикации в СМИ
                label_singular: ссылку
                widget: list
                required: false
                summary: "{{fields.title}}"
                hint: Например, рецензии и статьи о спектакле. Каждая ссылка откроется в новой вкладке.
                fields:
                  - { name: title, label: "Название издания или статьи", widget: string }
                  - { name: url, label: Ссылка, widget: string }

  - name: settings
    label: Информация на сайте
    files:
      - name: settings
        label: Тексты и контакты
        file: content/settings.json
        fields:
          - { name: hero_lead, label: Текст под логотипом, widget: text }
          - { name: marquee, label: Бегущая строка, widget: list, field: { name: item, label: Слово, widget: string } }
          - { name: about_title, label: "О театре: заголовок", widget: string }
          - { name: about_text, label: "О театре: абзацы", widget: list, field: { name: p, label: Абзац, widget: text } }
          - { name: afisha_title, label: "Афиша: заголовок раздела", widget: string, hint: "Например: Премьера или Ближайшие спектакли" }
          - name: stats
            label: Цифры
            widget: list
            summary: "{{fields.number}} {{fields.label}}"
            fields:
              - { name: number, label: Число, widget: number, value_type: int }
              - { name: label, label: Подпись, widget: string }
          - name: projects
            label: Проекты
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { name: title, label: Название, widget: string }
              - { name: text, label: Описание, widget: text }
          - { name: quote, label: Слоган на чёрном фоне, widget: text }
          - name: contacts
            label: Контакты
            widget: object
            fields:
              - { name: address, label: Адрес, widget: string }
              - { name: phone, label: Телефон, widget: string }
              - { name: email, label: Почта, widget: string }
              - { name: vk, label: Ссылка ВКонтакте, widget: string, required: false }
              - { name: telegram, label: Ссылка Telegram, widget: string, required: false }
